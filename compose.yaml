services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    stop_grace_period: 4m
    ports:
      - "8000:80"
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SERVER_NAME: ":80"
      AUTO_MIGRATE: "true"
      DB_QUEUE_RETRY_AFTER: "300"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: tory
      POSTGRES_USER: tory
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h forces TCP: the image's init phase runs a socket-only temporary
      # server that would otherwise satisfy a socket-based pg_isready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tory -d tory"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  vite:
    image: node:22-alpine
    working_dir: /app
    init: true
    command: sh -c "npm install && exec npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app

volumes:
  db_data:
  caddy_data:
  caddy_config:
